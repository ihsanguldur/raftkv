services:
  node1:
    build: .
    hostname: node1
    command: ["--id", "node1", "--port", "8080", "--addr", "node1:8080", "--peers", "node2:8080,node3:8080,node4:8080,node5:8080", "--data-dir", "/data"]
    ports:
      - "8081:8080"
    volumes:
      - node1-data:/data

  node2:
    build: .
    hostname: node2
    command: ["--id", "node2", "--port", "8080", "--addr", "node2:8080", "--peers", "node1:8080,node3:8080,node4:8080,node5:8080", "--data-dir", "/data"]
    ports:
      - "8082:8080"
    volumes:
      - node2-data:/data

  node3:
    build: .
    hostname: node3
    command: ["--id", "node3", "--port", "8080", "--addr", "node3:8080", "--peers", "node1:8080,node2:8080,node4:8080,node5:8080", "--data-dir", "/data"]
    ports:
      - "8083:8080"
    volumes:
      - node3-data:/data

  node4:
    build: .
    hostname: node4
    command: ["--id", "node4", "--port", "8080", "--addr", "node4:8080", "--peers", "node1:8080,node2:8080,node3:8080,node5:8080", "--data-dir", "/data"]
    ports:
      - "8084:8080"
    volumes:
      - node4-data:/data

  node5:
    build: .
    hostname: node5
    command: ["--id", "node5", "--port", "8080", "--addr", "node5:8080", "--peers", "node1:8080,node2:8080,node3:8080,node4:8080", "--data-dir", "/data"]
    ports:
      - "8085:8080"
    volumes:
      - node5-data:/data

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
